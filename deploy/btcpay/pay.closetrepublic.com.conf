# nginx site for BTCPay Server.
# 1. Get the certificate first (nginx must already serve closetrepublic.com):
#      sudo certbot certonly --nginx -d pay.closetrepublic.com
# 2. Install this file and reload:
#      sudo cp pay.closetrepublic.com.conf /etc/nginx/sites-available/
#      sudo ln -s /etc/nginx/sites-available/pay.closetrepublic.com.conf /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $btcpay_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pay.closetrepublic.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pay.closetrepublic.com;

    # Created by certbot in step 1
    ssl_certificate     /etc/letsencrypt/live/pay.closetrepublic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pay.closetrepublic.com/privkey.pem;

    # Matches the 14-day log promise in the Privacy Policy: no access log for checkout pages.
    access_log off;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:40009;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Checkout page updates over websockets
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $btcpay_connection_upgrade;

        proxy_buffer_size       128k;
        proxy_buffers           4 256k;
        proxy_busy_buffers_size 256k;
        proxy_read_timeout      300s;
    }
}
