# BTCPay Server for Closet Republic: Bitcoin (pruned) + Monero, behind the host's nginx.
# Only port 40009 on 127.0.0.1 is published; nginx proxies pay.closetrepublic.com to it.
# BTCPay trusts X-Forwarded-* headers from any source, which is safe only because the port
# is bound to 127.0.0.1. Never change it to 0.0.0.0 or publish it in the firewall.
# Image versions match btcpayserver-docker (master, October 2026).
#
# Start:   docker compose up -d
# Logs:    docker compose logs -f btcpayserver
# Update:  bump the image tags, then docker compose pull && docker compose up -d

name: btcpay

services:
  btcpayserver:
    image: btcpayserver/btcpayserver:2.4.5
    restart: unless-stopped
    ports:
      - "127.0.0.1:40009:49392"
    environment:
      BTCPAY_NETWORK: mainnet
      BTCPAY_BIND: 0.0.0.0:49392
      BTCPAY_ROOTPATH: /
      BTCPAY_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Application Name=btcpayserver;Database=btcpayservermainnet
      BTCPAY_EXPLORERPOSTGRES: User ID=postgres;Host=postgres;Port=5432;Application Name=btcpayserver;MaxPoolSize=80;Database=nbxplorermainnet
      BTCPAY_CHAINS: btc
      BTCPAY_BTCEXPLORERURL: http://nbxplorer:32838/
      BTCPAY_DEBUGLOG: btcpay.log
      BTCPAY_DOCKERDEPLOYMENT: "true"
      BTCPAY_NODEFAULTCHAIN: "true"
      # Monero plugin (install it from Server Settings > Plugins, then restart)
      BTCPAY_XMR_DAEMON_URI: http://monerod:18081
      BTCPAY_XMR_WALLET_DAEMON_URI: http://monerod_wallet:18082
      BTCPAY_XMR_WALLET_DAEMON_WALLETDIR: /root/xmr_wallet
    volumes:
      - btcpay_datadir:/datadir
      - btcpay_pluginsdir:/root/.btcpayserver/Plugins
      - nbxplorer_datadir:/root/.nbxplorer
      - xmr_wallet:/root/xmr_wallet
    depends_on:
      - postgres
      - nbxplorer

  postgres:
    image: btcpayserver/postgres:18.6
    restart: unless-stopped
    shm_size: 256mb
    command: ["-c", "random_page_cost=1.0", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      # Safe only because postgres is reachable from this compose network alone (no ports published).
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_datadir:/var/lib/postgresql

  nbxplorer:
    image: nicolasdorier/nbxplorer:2.6.19
    restart: unless-stopped
    environment:
      NBXPLORER_NETWORK: mainnet
      NBXPLORER_BIND: 0.0.0.0:32838
      NBXPLORER_TRIMEVENTS: 10000
      NBXPLORER_SIGNALFILESDIR: /datadir
      NBXPLORER_CHAINS: btc
      NBXPLORER_BTCRPCURL: http://bitcoind:43782/
      NBXPLORER_BTCNODEENDPOINT: bitcoind:39388
      NBXPLORER_POSTGRES: User ID=postgres;Host=postgres;Port=5432;Application Name=nbxplorer;MaxPoolSize=20;Database=nbxplorermainnet
    volumes:
      - nbxplorer_datadir:/datadir
      - bitcoin_datadir:/root/.bitcoin
    depends_on:
      - postgres
      - bitcoind

  bitcoind:
    image: btcpayserver/bitcoin:31.1-1
    restart: unless-stopped
    ulimits:
      nofile: { soft: 65536, hard: 65536 }
    environment:
      BITCOIN_NETWORK: mainnet
      CREATE_WALLET: "false"
      BITCOIN_WALLETDIR: /walletdata
      # prune=25000 keeps about 25 GB of blocks (enough to add Lightning later).
      BITCOIN_EXTRA_ARGS: |
        rpcport=43782
        rpcbind=0.0.0.0:43782
        rpcallowip=0.0.0.0/0
        port=39388
        whitelist=0.0.0.0/0
        maxmempool=500
        prune=25000
    volumes:
      - bitcoin_datadir:/data
      - bitcoin_wallet_datadir:/walletdata

  monerod:
    image: btcpayserver/monero:0.18.5.3
    restart: unless-stopped
    command: monerod --rpc-bind-ip=0.0.0.0 --confirm-external-bind --rpc-bind-port=18081 --non-interactive --block-notify="/bin/sh ./scripts/notifier.sh -X GET http://btcpayserver:49392/monerolikedaemoncallback/block?cryptoCode=xmr&hash=%s" --hide-my-port --prune-blockchain --enable-dns-blocklist
    volumes:
      - xmr_data:/data

  monerod_wallet:
    image: btcpayserver/monero:0.18.5.3
    restart: unless-stopped
    command: monero-wallet-rpc --rpc-bind-ip=0.0.0.0 --disable-rpc-login --confirm-external-bind --rpc-bind-port=18082 --non-interactive --trusted-daemon --daemon-address=monerod:18081 --wallet-dir=/wallet --tx-notify="/bin/sh ./scripts/notifier.sh -X GET http://btcpayserver:49392/monerolikedaemoncallback/tx?cryptoCode=xmr&hash=%s"
    volumes:
      - xmr_wallet:/wallet
    depends_on:
      - monerod

volumes:
  btcpay_datadir:
  btcpay_pluginsdir:
  postgres_datadir:
  nbxplorer_datadir:
  bitcoin_datadir:
  bitcoin_wallet_datadir:
  xmr_data:
  xmr_wallet:
